name: Deploy a Vercel

# Deploys with a token from the account that owns the project, so the
# commit author does not matter. Fixed, short URLs:
#   main -> production -> https://analogos.vercel.app
#   dev  -> preview    -> https://analogos-dev.vercel.app
on:
  push:
    branches: [main, dev]

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_A583nI4RAGtbkFJEUldqWYEy
  VERCEL_PROJECT_ID: prj_212cKp3iwgPNItQuyQrPrzWbjVHJ
  DEV_ALIAS: analogos-dev.vercel.app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "target=production" >> "$GITHUB_OUTPUT"
            echo "prod_flag=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "target=preview" >> "$GITHUB_OUTPUT"
            echo "prod_flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Vercel pull
        run: vercel pull --yes --environment=${{ steps.env.outputs.target }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Vercel build
        run: vercel build ${{ steps.env.outputs.prod_flag }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Check startup of the packaged function
        run: node scripts/check-vercel-function.mjs

      - name: Vercel deploy
        id: deploy
        env:
          # Dev and production receive the key only at runtime, from GitHub Secrets.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "The ANTHROPIC_API_KEY secret for the deployment AI is missing." >&2
            exit 1
          fi
          AI_ARGS=(--env "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY" --env "ANTHROPIC_MODEL=claude-sonnet-5-5")
          URL=$(vercel deploy --prebuilt ${{ steps.env.outputs.prod_flag }} "${AI_ARGS[@]}" --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed: $URL"

      - name: Fixed alias for dev
        if: github.ref == 'refs/heads/dev'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # The alias CLI queries the user even with an explicit scope.
          # The API assigns directly in the deployment team.
          node --input-type=module <<'JS'
          const { DEPLOYMENT_URL, DEV_ALIAS, VERCEL_ORG_ID, VERCEL_TOKEN } = process.env;
          const deployment = new URL(DEPLOYMENT_URL);
          if (deployment.protocol !== 'https:' || !deployment.hostname.endsWith('.vercel.app')) {
            throw new Error('Unexpected deployment URL');
          }
          const endpoint = new URL(`https://api.vercel.com/v2/deployments/${encodeURIComponent(deployment.hostname)}/aliases`);
          endpoint.searchParams.set('teamId', VERCEL_ORG_ID);
          const response = await fetch(endpoint, {
            method: 'POST',
            headers: { Authorization: `Bearer ${VERCEL_TOKEN}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ alias: DEV_ALIAS }),
            signal: AbortSignal.timeout(30000),
          });
          const result = await response.json();
          if (!response.ok || result.alias !== DEV_ALIAS) {
            throw new Error(`Alias not assigned (${response.status}): ${result.error?.message ?? 'unexpected response'}`);
          }
          console.log(`dev available at https://${result.alias}`);
          JS
